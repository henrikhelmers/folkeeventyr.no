# Site settings
title: Norske Folkeeventyr
# email: contact@pikselert.com
description: Norske folkeeventyr for barn og voksne
og_image: /images/_og.jpg
# baseurl: ""
url: "https://folkeeventyr.no"
permalink: /:title/
collections:
  eventyr:
    output: true
    permalink: /:title/
defaults:
  - scope: { type: eventyr }
    values: { layout: post }

highlighter: none
incremental: false
safe: true
strict_front_matter: true
include:
  - _og.jpg # Jekyll hopper ellers over filer som starter med _
exclude:
  - bin
  - README.md
  - _eventyr/*.json


